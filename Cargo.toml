[workspace]
resolver = "3"
members = ["crates/radar-core", "src-tauri"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
