<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>库存雷达 · 隔离界面测试</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // DEV harness only. All stock states/statistics are generated by radar-core in memory.
      // This file is not a Vite production entry point and never contacts native IPC.
      import { mockIPC } from "@tauri-apps/api/mocks";
      import fixture from "./.ui-fixture.json";
      globalThis.isTauri = true;
      globalThis.testCalls = [];
      const snapshot = structuredClone(fixture.snapshot);
      let feishuConfigured = new URLSearchParams(location.search).has("feishu");
      if (feishuConfigured) {
        snapshot.settings.mode = "manual";
        snapshot.settings.feishu_enabled = true;
        snapshot.targets.forEach((target) => {
          target.source = "manual";
        });
      }
      const scanScenario = new URLSearchParams(location.search).get("scan");
      if (scanScenario) {
        snapshot.settings.mode = "apple";
        snapshot.settings.apple_personal_access = true;
        snapshot.settings.scan_running = scanScenario === "on";
        snapshot.automatic_available = true;
        snapshot.scanner.access_kind = "personal";
        snapshot.settings.scan_interval_seconds = 30;
        snapshot.scanner.minimum_interval_seconds = 5;
        snapshot.scanner.batch_count = 6;
        snapshot.settings.scan_last_http_version = "HTTP/2";
        snapshot.settings.scan_last_duration_ms = 420;
        if (scanScenario === "blocked") {
          snapshot.settings.scan_stop_reason = "BLOCKED";
          snapshot.scanner.stop_reason = "BLOCKED";
          snapshot.scanner.resume_after = new Date(
            Date.now() + 600000,
          ).toISOString();
        }
      }
      mockIPC(
        (cmd, args) => {
          globalThis.testCalls.push({ cmd, args });
          switch (cmd) {
            case "bootstrap":
              return new URLSearchParams(location.search).has("empty")
                ? { ...snapshot, targets: [], groups: [] }
                : snapshot;
            case "save_settings":
              snapshot.settings = args.settings;
              if (scanScenario) {
                snapshot.scanner.minimum_interval_seconds =
                  args.settings.scan_connection_protection ? 180 : 5;
              }
              return null;
            case "set_scanning":
              snapshot.settings.scan_running = args.enabled;
              return null;
            case "feishu_configured":
              return feishuConfigured;
            case "import_feishu_keychain":
            case "set_feishu":
              feishuConfigured = true;
              snapshot.settings.feishu_enabled = false;
              return null;
            case "set_feishu_enabled":
              snapshot.settings.feishu_enabled = args.enabled;
              return null;
            case "remove_feishu":
              feishuConfigured = false;
              snapshot.settings.feishu_enabled = false;
              return null;
            case "set_target_feishu":
              snapshot.targets.find(
                (target) => target.id === args.id,
              ).feishu_enabled = args.enabled;
              return null;
            case "batch_update_targets": {
              const ids = new Set(args.ids);
              snapshot.targets.forEach((target) => {
                if (!ids.has(target.id)) return;
                if (args.action === "enable_feishu")
                  target.feishu_enabled = true;
                if (args.action === "disable_feishu")
                  target.feishu_enabled = false;
                if (args.action === "pause") target.enabled = false;
                if (args.action === "resume") target.enabled = true;
                if (args.action === "high_priority") target.priority = 2;
                if (args.action === "normal_priority") target.priority = 0;
              });
              return ids.size;
            }
            case "send_target_feishu":
            case "test_notification":
              return null;
            case "catalog":
              return fixture.catalog;
            // UI-only fixture filtering; production filtering/statistics live in Rust.
            case "query_history": {
              const f = args.filter;
              const until = f.to || new Date().toISOString();
              const since = f.from || new Date(new Date(until).getTime() - (f.days || 7)*86400000).toISOString();
              if (new Date(since)>new Date(until) || new Date(until)-new Date(since)>180*86400000) throw new Error("开始时间须不晚于结束时间，范围最多180天");
              const rows = fixture.history.filter(r => (!f.targetId || r.target_id===f.targetId) && (!f.state || r.state===f.state) && (!f.locale || r.locale===f.locale) && (!f.event || (f.event==='EVENTS_ONLY' ? !!r.event : r.event===f.event)) && f.query.toLowerCase().split(/\s+/).every(w=>(r.product+' '+r.store).toLowerCase().includes(w)) && new Date(r.observed_at)>=new Date(since) && new Date(r.observed_at)<=new Date(until));
              const summary = {total:rows.length,valid:rows.filter(r=>r.state!=='UNKNOWN').length,in_stock:rows.filter(r=>r.state==='IN_STOCK').length,events:rows.filter(r=>r.event && r.event!=='HEALTH_ALERT').length,first_seen:null,last_seen:null,cells:[]};
              return {rows,summary,since,until};
            }
            case "history":
              return fixture.history;
            case "summary":
              return fixture.summary;
            case "bark_configured":
              return false;
            case "plugin:autostart|is_enabled":
              return false;
            case "list_backups":
              return [];
            case "add_targets":
              return {
                added: args.productIds.length * args.storeIds.length,
                duplicates: 0,
                combinations: args.productIds.length * args.storeIds.length,
              };
            default:
              throw new Error("隔离测试中未实现的命令: " + cmd);
          }
        },
        { shouldMockEvents: true },
      );
      await import("/src/main.tsx");
    </script>
  </body>
</html>
